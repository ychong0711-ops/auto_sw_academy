# Auto SW Academy — CI pipeline
# Runs on push/PR: build → test 18 suites (259 checks) → DBC trace decode verification
name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc make python3-pip

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc make python3

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw make python3 --no-progress -y

      - name: Install Python packages
        run: pip3 install cantools

      - name: Generate configuration
        run: make gen

      - name: Build all targets
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Run all test suites (make check)
        run: make check

      - name: Run DBC trace decode verification (make trace-check)
        run: make trace-check
