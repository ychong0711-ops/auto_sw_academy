# Auto SW Academy — CI pipeline
# Runs on push/PR: build → test 18 suites (259 checks) → DBC trace decode verification
name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc g++ make python3-pip

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc make python3

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw make python3 --no-progress -y

      - name: Set up Python detection (Windows)
        if: runner.os == 'Windows'
        run: |
          # Windows has 'python' not 'python3' — tell Makefile to use it
          echo "PYTHON=python" >> $GITHUB_ENV
          # Create python3→python alias in Git-embedded MSYS2 /usr/bin
          python_loc=$(command -v python 2>/dev/null || command -v py 2>/dev/null)
          if [ -n "$python_loc" ] && [ ! -x /usr/bin/python3 ]; then
            ln -sf "$python_loc" /usr/bin/python3 2>/dev/null || true
          fi

      - name: Install Python packages
        run: |
          py_cmd=$(command -v python3 2>/dev/null || command -v python 2>/dev/null || echo python3)
          $py_cmd -m pip install cantools

      - name: Generate configuration
        run: make gen

      - name: Build all targets
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Run all test suites (make check)
        run: make check

      - name: Run DBC trace decode verification (make trace-check)
        run: make trace-check
