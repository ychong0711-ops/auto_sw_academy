# Auto SW Academy — Nightly full rebuild & regression check
# Runs daily at 02:00 UTC to catch environment drift and regressions.
name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y gcc g++ make python3-pip valgrind
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install gcc make python3
          fi

      - name: Install Python packages
        run: |
          py_cmd=$(command -v python3 2>/dev/null || command -v python 2>/dev/null || echo python3)
          pip_extra=""
          if [ "$RUNNER_OS" = "macOS" ] && $py_cmd -m pip --version >/dev/null 2>&1; then
            # Homebrew Python blocks system pip installs (PEP 668)
            pip_extra="--break-system-packages"
          fi
          $py_cmd -m pip install $pip_extra cantools

      - name: Full clean rebuild
        run: make clean && make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Run all test suites
        run: make check

      - name: DBC trace decode verification
        run: make trace-check

      - name: Memory check (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          for t in build/ex1_* build/ex2_* build/ex3_* build/ex4_*; do
            echo "=== valgrind $t ==="
            valgrind --leak-check=full --error-exitcode=1 "$t" 2>&1 | tail -5
          done
